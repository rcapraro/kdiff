name: Publish

# A tag is the release trigger: pushing `vX.Y.Z` publishes the modules and writes the release notes
# from that version's CHANGELOG.md section. workflow_dispatch is the manual path for a tag whose run
# failed halfway, and republishes the same version rather than inventing a new one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The tag names the version; the build declares it. Publishing artifacts whose version does not
      # match the tag that triggered it is the one mistake that cannot be taken back, so it fails here.
      - name: Check the tag matches the declared version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          declared=$(grep -m1 '^    version = ' build.gradle.kts | cut -d'"' -f2)
          if [ "$version" != "$declared" ]; then
            echo "tag $tag declares version $version, but the build declares $declared" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: ./gradlew check --no-daemon

      # One deployment for the three modules, released automatically once the Portal validates it.
      # The Portal rejects a version it has already released, which is why re-running a tag is safe.
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Build the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./.github/scripts/changelog-section.sh "$VERSION" > notes.md
          cat >> notes.md <<EOF

          ## Coordinates

          \`\`\`kotlin
          implementation("io.github.rcapraro:kdiff-annotations:$VERSION")
          implementation("io.github.rcapraro:kdiff-runtime:$VERSION")
          ksp("io.github.rcapraro:kdiff-processor:$VERSION")
          \`\`\`
          EOF

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "kdiff $VERSION" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "kdiff $VERSION" --notes-file notes.md --latest
          fi
